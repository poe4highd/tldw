<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLDW - 视频精华速览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 90%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        .tagline {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 0.8rem;
            text-align: center;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        .message.info {
            background: #e7f1ff;
            color: #004085;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }
        .status.online { color: #28a745; }
        .status.offline { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TLDW</h1>
        <p class="tagline">Too Long; Didn't Watch - 视频精华速览</p>

        <div class="tabs">
            <div class="tab active" data-tab="submit">提交视频</div>
            <div class="tab" data-tab="register">注册</div>
            <div class="tab" data-tab="login">登录</div>
        </div>

        <!-- 提交视频 -->
        <div id="submit" class="tab-content active">
            <form id="submitForm">
                <div class="form-group">
                    <label for="youtube_url">YouTube 链接</label>
                    <input type="url" id="youtube_url" name="youtube_url"
                           placeholder="https://www.youtube.com/watch?v=..." required>
                </div>
                <button type="submit" id="submitBtn">开始分析</button>
            </form>
            <div id="submitMessage"></div>
        </div>

        <!-- 注册 -->
        <div id="register" class="tab-content">
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg_email">邮箱</label>
                    <input type="email" id="reg_email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="reg_password">密码</label>
                    <input type="password" id="reg_password" placeholder="至少6位" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="reg_confirm">确认密码</label>
                    <input type="password" id="reg_confirm" placeholder="再次输入密码" required>
                </div>
                <button type="submit">注册</button>
            </form>
            <div id="registerMessage"></div>
        </div>

        <!-- 登录 -->
        <div id="login" class="tab-content">
            <form id="loginForm">
                <div class="form-group">
                    <label for="login_email">邮箱</label>
                    <input type="email" id="login_email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login_password">密码</label>
                    <input type="password" id="login_password" placeholder="密码" required>
                </div>
                <button type="submit">登录</button>
            </form>
            <div id="loginMessage"></div>
        </div>

        <div id="backendStatus" class="status">检查后端状态...</div>
    </div>

    <script>
        const API_BASE = '';  // 使用相对路径，Vercel rewrites 转发

        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // 显示消息
        function showMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.className = `message ${type}`;
            el.textContent = message;
        }

        // 检查后端状态
        async function checkBackend() {
            const statusEl = document.getElementById('backendStatus');
            try {
                const res = await fetch(`${API_BASE}/api/health`, { timeout: 5000 });
                const data = await res.json();
                if (data.status === 'ok') {
                    statusEl.textContent = `后端在线 | GPU: ${data.gpu_name || '无'}`;
                    statusEl.className = 'status online';
                }
            } catch (e) {
                statusEl.textContent = '后端离线 - 请确保本地服务已启动';
                statusEl.className = 'status offline';
            }
        }

        // 提交视频
        document.getElementById('submitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const url = document.getElementById('youtube_url').value;

            btn.disabled = true;
            btn.textContent = '处理中...';
            showMessage('submitMessage', '正在提交...', 'info');

            try {
                const res = await fetch(`${API_BASE}/api/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `youtube_url=${encodeURIComponent(url)}`
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('submitMessage', `处理完成! 视频ID: ${data.video_id}`, 'success');
                } else {
                    showMessage('submitMessage', data.error || '提交失败', 'error');
                }
            } catch (e) {
                showMessage('submitMessage', '网络错误，请检查后端是否运行', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '开始分析';
            }
        });

        // 注册（暂存本地）
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            const confirm = document.getElementById('reg_confirm').value;

            if (password !== confirm) {
                showMessage('registerMessage', '两次密码不一致', 'error');
                return;
            }

            // TODO: 接入后端注册 API
            localStorage.setItem('user', JSON.stringify({ email }));
            showMessage('registerMessage', '注册成功！（本地模式）', 'success');
        });

        // 登录（暂存本地）
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login_email').value;

            // TODO: 接入后端登录 API
            localStorage.setItem('user', JSON.stringify({ email }));
            showMessage('loginMessage', '登录成功！（本地模式）', 'success');
        });

        // 页面加载时检查后端
        checkBackend();
        setInterval(checkBackend, 30000);
    </script>
</body>
</html>
